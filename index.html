<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Buddy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64' aria-hidden='true'%3E%3Crect width='64' height='64' rx='16' fill='%23e4002b'/%3E%3Cpath d='M32 15 7 28l25 13 25-13z' fill='%23fff'/%3E%3Cpath d='M17 36v9c0 3.500 6.500 7 15 7s15-3.500 15-7v-9l-15 7.500z' fill='%23ffc906'/%3E%3Cpath d='M54 29v15' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>
<div id="app">
  <div class="top"><div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#e4002b"/><path d="M32 15 7 28l25 13 25-13z" fill="#fff"/><path d="M17 36v9c0 3.500 6.500 7 15 7s15-3.500 15-7v-9l-15 7.500z" fill="#ffc906"/><path d="M54 29v15" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg><span>Student <em>Buddy</em></span></div><div class="tr"><button class="ic th" id="th" onclick="theme()" aria-label="Switch dark or light mode"></button><button class="av" id="av" onclick="go('me')" aria-label="Profile">?</button></div></div>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sbox" role="dialog" aria-modal="true"></div></div>
<div id="ob"><div class="obi" id="obi"></div></div>
<button class="fab" id="fab" onclick="openChat()" aria-label="Ask Buddy, the chat helper"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.600 7.100L4 20l1-4.500A8 8 0 1 1 21 12z"/><path d="M8.500 12h.01M12 12h.01M15.500 12h.01"/></svg><span>Ask Buddy</span></button>
<div id="chat" class="chat" role="dialog" aria-label="Ask Buddy">
  <div class="ch-h"><svg class="lg" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#e4002b"/><path d="M32 15 7 28l25 13 25-13z" fill="#fff"/><path d="M17 36v9c0 3.500 6.500 7 15 7s15-3.500 15-7v-9l-15 7.500z" fill="#ffc906"/><path d="M54 29v15" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg><div><b>Ask Buddy</b><small>Helper for this app</small></div><button class="ic th" onclick="closeChat()" aria-label="Close chat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="ch-ms" id="cms" aria-live="polite"></div>
  <div class="chips" id="cch"></div>
  <form class="ch-f" onsubmit="return sendForm(event)"><input class="f" id="cin" placeholder="Ask anything, in English or Hinglish" autocomplete="off" aria-label="Your message"><button class="btn" type="submit">Send</button></form>
</div>
<div id="toast"></div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/data-extra.js"></script>
<script src="js/sheet.js"></script>
<script src="js/app.js"></script>
<script src="js/features.js"></script>
<script src="js/tinyfish.js"></script>
<script src="js/tinyfish2.js"></script>
<script src="js/finder.js"></script>
<script src="js/opportunities.js"></script>
<script src="js/main.js"></script>
</body>
</html>
